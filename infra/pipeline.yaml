AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hop Skip Jump delivery pipeline. Sourced from GitHub via a CodeConnections
  connection, it builds the SPA, deploys infra/site.yaml as its own stack, then
  syncs the build output to S3 and invalidates CloudFront.
  Deploy this stack in us-east-1 so the CloudFront certificate is in-region.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Source}
        Parameters: [ConnectionArn, RepositoryId, BranchName]
      - Label: {default: Site}
        Parameters: [SiteStackName, PrimaryDomainName, AltDomainName, CertificateArn, PriceClass]
      - Label: {default: Build}
        Parameters: [BuildImage, NodeVersion]

Parameters:
  ConnectionArn:
    Type: String
    AllowedPattern: '^arn:aws:codestar-connections:.+|^arn:aws:codeconnections:.+'
    Description: >
      ARN of an AWS CodeConnections (formerly CodeStar Connections) connection to
      GitHub, already in AVAILABLE state. The OAuth handshake cannot be done from
      CloudFormation, so create the connection in the console first.
  RepositoryId:
    Type: String
    Default: davis190/HopSkipJump
    Description: GitHub repository as owner/name.
  BranchName:
    Type: String
    Default: main
  SiteStackName:
    Type: String
    Default: hopskipjump-site
    AllowedPattern: '^[a-z][a-z0-9-]{2,48}$'
    Description: Name of the stack the pipeline creates for the bucket and CloudFront.
  PrimaryDomainName:
    Type: String
    Default: hopskipjump.claytondavis.dev
  AltDomainName:
    Type: String
    Default: hsj.claytondavis.dev
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:\d{12}:certificate/.+$'
    Description: us-east-1 ACM certificate ARN covering both domain names.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
  BuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
  NodeVersion:
    Type: String
    Default: '20'
    Description: Node runtime for CodeBuild. Bump if the build image ships a newer one.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-artifacts-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifacts
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  # ---------------------------------------------------------------- build ----

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${AWS::StackName}-build'
      RetentionInDays: 30

  PublishLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${AWS::StackName}-publish'
      RetentionInDays: 30

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub '${BuildLogGroup.Arn}:*'
                  - !Sub '${PublishLogGroup.Arn}:*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              # The site bucket name is derived from the site stack name, so it can
              # be scoped here even though the bucket does not exist yet.
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub 'arn:aws:s3:::${SiteStackName}-${AWS::AccountId}'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub 'arn:aws:s3:::${SiteStackName}-${AWS::AccountId}/*'
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-build'
      Description: Install, test, and build the Hop Skip Jump SPA.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: {Type: CODEPIPELINE}
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref BuildImage
        EnvironmentVariables:
          - {Name: NODE_VERSION, Value: !Ref NodeVersion}
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      TimeoutInMinutes: 15

  PublishProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-publish'
      Description: Sync the built site to S3 and invalidate CloudFront.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: {Type: CODEPIPELINE}
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-publish.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref BuildImage
        EnvironmentVariables:
          - {Name: SITE_STACK_NAME, Value: !Ref SiteStackName}
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref PublishLogGroup
      TimeoutInMinutes: 15

  # ------------------------------------------------------ infra deploy role ----

  # Role CloudFormation assumes to manage the site stack's resources.
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: site-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The S3 bucket resource handler reads back the bucket's full
              # configuration on every create and update, far more than this
              # template sets, so the read side is granted broadly. Both
              # statements are still confined to the one site bucket, and a
              # bucket ARN without /* grants no object-level access.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:Get*
                  - s3:Put*
                  - s3:List*
                Resource: !Sub 'arn:aws:s3:::${SiteStackName}-${AWS::AccountId}'
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicyConfig
                  - cloudfront:GetCachePolicy
                  - cloudfront:List*
                # CloudFront resources cannot be scoped to an ARN that
                # CloudFormation has not created yet.
                Resource: '*'
              - Effect: Allow
                Action: [acm:DescribeCertificate, acm:ListCertificates]
                Resource: '*'

  # ------------------------------------------------------------- pipeline ----

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codepipeline.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: [codestar-connections:UseConnection, codeconnections:UseConnection]
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource:
                  - !GetAtt BuildProject.Arn
                  - !GetAtt PublishProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                  - cloudformation:SetStackPolicy
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref AWS::StackName
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                DetectChanges: true
              OutputArtifacts: [{Name: Source}]
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: TestAndBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts: [{Name: Source}]
              OutputArtifacts: [{Name: Built}]
              RunOrder: 1

        - Name: Infrastructure
          Actions:
            - Name: DeploySiteStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref SiteStackName
                TemplatePath: Built::infra/site.yaml
                RoleArn: !GetAtt CloudFormationRole.Arn
                Capabilities: CAPABILITY_IAM
                ParameterOverrides: !Sub |
                  {
                    "SiteStackName": "${SiteStackName}",
                    "PrimaryDomainName": "${PrimaryDomainName}",
                    "AltDomainName": "${AltDomainName}",
                    "CertificateArn": "${CertificateArn}",
                    "PriceClass": "${PriceClass}"
                  }
              InputArtifacts: [{Name: Built}]
              RunOrder: 1

        - Name: Publish
          Actions:
            - Name: SyncAndInvalidate
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref PublishProject
              InputArtifacts: [{Name: Built}]
              RunOrder: 1

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view'
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  SiteStackName:
    Description: Read BucketName / DistributionDomainName from this stack's outputs after the first run.
    Value: !Ref SiteStackName
