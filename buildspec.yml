version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: $NODE_VERSION
    commands:
      - node --version
      - npm ci
  build:
    commands:
      - npm test
      - npm run build

artifacts:
  files:
    # The Publish stage takes this artifact as its CodeBuild source, so it has to
    # carry the buildspec that stage runs, alongside the template the
    # Infrastructure stage deploys.
    - 'dist/**/*'
    - 'infra/site.yaml'
    - 'buildspec-publish.yml'

cache:
  paths:
    - 'node_modules/**/*'
